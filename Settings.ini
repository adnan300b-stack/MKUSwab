; ============================================================
;  MKUSwap - Settings.ini
; ============================================================
;  Syntax:
;     chang(VISUAL -> SELECTED)
;
;  When you pick SELECTED, the game loads the model and the
;  basic attacks of VISUAL, while the special moves (projectiles
;  etc.) stay the ones of SELECTED.
;
;  Example:
;     chang(SCORPION->SUBZERO)
;  -> picking Sub-Zero shows Scorpion's model and strikes,
;     but the ice ball stays Sub-Zero's.
;
;  Notes:
;  - Names are case-insensitive and ignore spaces/-/'  (SOBZERO = SUB-ZERO)
;  - Lines starting with ; or # are comments
;  - Maximum 32 swaps
; ============================================================

chang(SCORPION->SUBZERO)
chang(SUBZERO->SCORPION)
